ui:
  ssl: false
  host: localhost
  port: 4000
  baseUrl: https://ucudir.ucu.ac.ug
  nameSpace: /
  useProxies: true

ssr:
  inlineCriticalCss: false
  enableSearchComponent: false
  enableBrowseComponent: false
  transferState: true
  replaceRestUrl: true

rest:
  ssl: true
  host: sandbox.dspace.org
  port: 443
  nameSpace: /server
  # SSR runs on the same host as the DSpace backend. Use the internal endpoint
  # so rendering does not depend on the public reverse-proxy/hairpin route.
  ssrBaseUrl: http://localhost:8080/server

themes:
  - name: ucu-branding
    extends: custom
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.png
          sizes: any
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/custom/images/favicons/apple-touch-icon.png
      - tagName: link
        attributes:
          rel: manifest
          href: assets/custom/images/favicons/manifest.webmanifest
