ui:
  ssl: false
  host: localhost
  port: 4000
  # Public canonical UI origin. This must match dspace.ui.url in the DSpace backend.
  # robots.txt, sitemap links, canonical URLs, redirects, and SSR host validation use this value.
  baseUrl: https://scholar.ucu.ac.ug
  nameSpace: /
  useProxies: true

ssr:
  inlineCriticalCss: false
  enableSearchComponent: false
  enableBrowseComponent: false
  transferState: true
  replaceRestUrl: true

rest:
  ssl: true
  # Keep the UI and REST API on the Uganda Christian University repository.
  host: demo.dspace.org
  port: 443
  nameSpace: /server

# SDG, Uganda Vision 2040, and Agenda 2063 goal badges are intentionally disabled for Scholar.
# goalBadges:
#   sdg:
#     enabled: true
#   ndp:
#     enabled: true
#   agenda2063:
#     enabled: true

themes:
  - name: ucu-branding
    extends: custom
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.png
          sizes: any
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/custom/images/favicons/apple-touch-icon.png
      - tagName: link
        attributes:
          rel: manifest
          href: assets/custom/images/favicons/manifest.webmanifest
