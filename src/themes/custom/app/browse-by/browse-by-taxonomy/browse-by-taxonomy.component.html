<section>
  @if (displayTitle && !isDisabledGoalVocabulary()) {
    <h1>
      {{ ('browse.title') | translate:{
      field: 'browse.metadata.' + vocabularyName | translate,
      startsWith: '',
      value: '',
      } }}
    </h1>
  }
  <!-- Scholar: SDG and Uganda Vision 2040 browse grids are intentionally disabled. -->
  <!-- @if (isSdgVocabulary()) { <ds-sdg-browse-grid></ds-sdg-browse-grid> } -->
  <!-- @else if (isNdpVocabulary()) { <ds-ndp-browse-grid></ds-ndp-browse-grid> } -->
  @if (!isDisabledGoalVocabulary()) {
    <div class="mb-3">
      <ds-vocabulary-treeview [description]="description"
        [vocabularyOptions]="vocabularyOptions"
        [multiSelect]="true"
        [showAdd]="false"
        (select)="onSelect($event)"
        (deselect)="onDeselect($event)">
      </ds-vocabulary-treeview>
    </div>
    <a class="btn btn-primary"
      [routerLink]="['/search']"
      [queryParams]="queryParams"
      [queryParamsHandling]="'merge'"
      role="link"
      tabindex="0">
      {{ 'browse.taxonomy.button' | translate }}
    </a>
  }
</section>
