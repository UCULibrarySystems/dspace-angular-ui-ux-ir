@if (preview$ | async; as preview) {
  <section class="pdf-preview" [attr.aria-label]="preview.title">
    <div class="pdf-preview-header">
      <span class="fas fa-file-pdf" aria-hidden="true"></span>
      <span>{{ preview.title }}</span>
    </div>
    @if (isLoading) {
      <p class="pdf-preview-status" role="status">{{ 'item.page.pdf-preview.loading' | translate }}</p>
    }
    @if (previewError) {
      <p class="pdf-preview-status" role="alert">{{ 'item.page.pdf-preview.error' | translate }}</p>
    }
    <div #pdfPages class="pdf-preview-pages" [attr.aria-label]="preview.title"></div>
  </section>
}
