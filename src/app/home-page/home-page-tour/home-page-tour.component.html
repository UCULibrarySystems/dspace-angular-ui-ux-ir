@if (isOpen) {
  <div class="tour-shade" aria-hidden="true"></div>
  <div
    class="tour-highlight"
    aria-hidden="true"
    [style.top.px]="highlight.top"
    [style.left.px]="highlight.left"
    [style.width.px]="highlight.width"
    [style.height.px]="highlight.height">
  </div>
  <section #tourCard class="tour-card" role="dialog" aria-modal="false" aria-labelledby="tour-title" aria-describedby="tour-description" tabindex="-1">
    <header class="tour-card-header">
      <span>UCUDIR site tour</span>
      <button type="button" class="tour-close" (click)="closeTour()" aria-label="Cancel site tour" title="Cancel tour">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </header>
    <p class="tour-progress">Stop {{ activeIndex + 1 }} of {{ steps.length }}</p>
    <h2 id="tour-title" aria-live="polite">{{ steps[activeIndex].title }}</h2>
    <p id="tour-description">{{ steps[activeIndex].description }}</p>
    <div class="tour-controls">
      <button type="button" class="tour-secondary" (click)="previous()" [disabled]="activeIndex === 0">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Previous
      </button>
      <button type="button" class="tour-primary" (click)="next()">
        {{ activeIndex === steps.length - 1 ? 'Finish' : 'Next' }}
        @if (activeIndex !== steps.length - 1) {
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
        }
      </button>
      <button type="button" class="tour-cancel" (click)="closeTour()">Cancel</button>
    </div>
  </section>
}
