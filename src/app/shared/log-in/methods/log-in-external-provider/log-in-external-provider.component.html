<button
  class="btn btn-lg btn-primary w-100 text-white"
  [class.ucu-orcid-login]="authMethod?.authMethodType === 'orcid'"
  (click)="redirectToExternalProvider()"
  type="button">
  @if (authMethod?.authMethodType === 'orcid') {
    <img class="ucu-orcid-login-logo" src="assets/custom/images/orcid-id.webp" alt="" aria-hidden="true">
  } @else {
    <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
  }
  <span>{{ getButtonLabel() | translate }}</span>
</button>
