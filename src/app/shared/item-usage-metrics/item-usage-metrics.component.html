@if (metrics$ | async; as metrics) {
  <div class="item-usage-metrics">
    <span [attr.aria-label]="(metrics.views === null ? 'item.usage.unavailable' : 'item.usage.views') | translate" [title]="'item.usage.views' | translate">
      <i class="fa fa-eye" aria-hidden="true"></i>
      @if (metrics.views === null) { — } @else { {{ metrics.views | number }} }
    </span>
    <span [attr.aria-label]="(metrics.downloads === null ? 'item.usage.unavailable' : 'item.usage.downloads') | translate" [title]="'item.usage.downloads' | translate">
      <i class="fas fa-download" aria-hidden="true"></i>
      @if (metrics.downloads === null) { — } @else { {{ metrics.downloads | number }} }
    </span>
  </div>
}
